name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build and package Windows Desktop EXE
        run: npm run package:win

      - name: Compress packaged executable
        shell: pwsh
        run: |
          Compress-Archive -Path "release/NFTPublicMintSniper-win32-x64/*" -DestinationPath "NFTPublicMintSniper-Windows-x64.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFTPublicMintSniper-Windows-x64
          path: NFTPublicMintSniper-Windows-x64.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: Release v1.0.0 (Windows Desktop Client)
          body: |
            ## NFT Public Mint Sniper (SeaDrop 定时抢购工具桌面版)
            
            - 针对 Windows x64 系统编译原生桌面客户端
            - 包含完整的离线 Chromium 引擎，无跨域限制直连 RPC
            - 支持 Robinhood Chain、Ink (Kraken L2)、Ethereum、Base、OP、Arbitrum、Polygon
            - 下载下方 ZIP 压缩包解压后，直接双击 `NFTPublicMintSniper.exe` 即可使用，无需安装 Node.js！
          files: NFTPublicMintSniper-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
